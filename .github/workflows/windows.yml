name: Windows build and installer
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release to attach the installer to (leave empty for build only)
        required: false
        default: ''
  push:
    branches: [main]
    paths: ['Windows/**', 'Assets/**', '.github/workflows/windows.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained Windows app
        shell: pwsh
        run: |
          dotnet publish Windows/Pippy.csproj -c Release -r win-x64 --self-contained true -o dist/windows/publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test logic, assets, and live UI
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist/windows/publish/Pippy.exe).Path
          $p = Start-Process $exe -ArgumentList '--self-test' -Wait -PassThru
          Get-Content "$env:TEMP/pippy-test-result.txt"
          if ($p.ExitCode -ne 0) { throw 'Self tests failed' }
          $output = "$env:RUNNER_TEMP/pippy-previews"
          $p = Start-Process $exe -ArgumentList @('--smoke-test', $output) -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$output/error.txt"; throw 'UI smoke test failed' }
          Get-Content "$output/smoke-result.txt"
      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" Windows/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installation and uninstallation
        shell: pwsh
        run: |
          $setup = (Resolve-Path dist/windows/Pippy-0.5-Windows-x64-Setup.exe).Path
          $p = Start-Process $setup -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Install failed' }
          $installed = "$env:LOCALAPPDATA/Programs/Pippy/Pippy.exe"
          if (!(Test-Path $installed)) { throw 'Installed executable missing' }
          $p = Start-Process $installed -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Installed app test failed' }
          $p = Start-Process "$env:LOCALAPPDATA/Programs/Pippy/unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or (Test-Path $installed)) { throw 'Uninstall failed' }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$hash  Pippy-0.5-Windows-x64-Setup.exe" | Set-Content dist/windows/SHA256SUMS-Windows.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-previews
          path: ${{ runner.temp }}/pippy-previews
      - uses: actions/upload-artifact@v4
        with:
          name: pippy-windows-installer
          path: |
            dist/windows/*Setup.exe
            dist/windows/SHA256SUMS-Windows.txt
      - name: Attach installer to existing release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: gh release upload "$env:RELEASE_TAG" dist/windows/Pippy-0.5-Windows-x64-Setup.exe dist/windows/SHA256SUMS-Windows.txt
